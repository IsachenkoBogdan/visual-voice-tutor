version: "3.9"

services:
  backend:
    build: .
    container_name: vvt-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7.4
    container_name: vvt-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  web:
    image: node:22
    container_name: vvt-web
    working_dir: /workspace/apps/web
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
      NEXT_PUBLIC_API_KEY: ${API_AUTH_TOKEN:-}
    volumes:
      - ./:/workspace
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
